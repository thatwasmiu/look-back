<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Look Back</title>
    <link rel="icon" type="image/svg+xml" href="/brand/logo.svg" />
    <meta name="description" content="Scrapbook albums for your photos &amp; videos — decorate, flip, share." />
    <!-- Link previews (Facebook, Zalo, Messenger…). __ORIGIN__ is filled in by nginx (sub_filter): crawlers need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Look Back" />
    <meta property="og:title" content="Look Back" />
    <meta property="og:description" content="Scrapbook albums for your photos &amp; videos — decorate, flip, share." />
    <meta property="og:url" content="__ORIGIN__/" />
    <meta property="og:image" content="__ORIGIN__/brand/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Look Back — scrapbook albums" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
