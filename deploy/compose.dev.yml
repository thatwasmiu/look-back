name: scrapbook
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: scrapbook
      POSTGRES_USER: scrapbook
      POSTGRES_PASSWORD: scrapbook
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgres://scrapbook:scrapbook@db:5432/scrapbook
    ports:
      - "5173:5173"
      - "3000:3000"
    depends_on:
      - db
volumes:
  pgdata:
  node_modules:
