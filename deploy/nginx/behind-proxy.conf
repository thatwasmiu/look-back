# Default mode (LOOKBACK_MODE=behind-proxy): an outer nginx on the host terminates HTTPS and proxies here over
# plain HTTP. compose.yml publishes this only on 127.0.0.1:2611, so nothing outside the host can reach it —
# which is what makes trusting the forwarded IP below safe.
include /etc/nginx/lookback/common-http.inc;

server {
  listen 80;
  server_name _;

  # The visitor's real IP comes from the outer proxy. Requests arrive from the host via Docker's bridge
  # (a private address), so trust private ranges; X-Forwarded-For set by the outer nginx becomes $remote_addr.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  set $fwd_proto https; # browsers always reach the outer proxy over HTTPS
  include /etc/nginx/lookback/app-locations.inc;
}
