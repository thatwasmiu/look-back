# Standalone mode (LOOKBACK_MODE=standalone, via compose.standalone.yml): this nginx terminates TLS itself
# on 80/443 (certs mounted at /etc/nginx/certs). For servers without an outer HTTPS nginx.
include /etc/nginx/lookback/common-http.inc;

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  set $fwd_proto $scheme;
  include /etc/nginx/lookback/app-locations.inc;
}
