name: scrapbook-prod
x-app: &app
  build: { context: .., dockerfile: deploy/Dockerfile }
  env_file: .env
  restart: unless-stopped
  depends_on: { db: { condition: service_healthy } }
  environment:
    TEMPLATE_MUSIC_DIR: /data/template-music
  volumes:
    - media:/data/media
    - uploads:/data/uploads
    # Optional tracks for built-in album templates (e.g. squids.mp3). Your own files: kept out of git and the images.
    - ./template-music:/data/template-music:ro

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: scrapbook
      POSTGRES_USER: ${POSTGRES_USER:-scrapbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-scrapbook}"]
      interval: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    <<: *app
    image: ${IMAGE_PREFIX:-dastewasmiu/scrapbook}-api:${IMAGE_TAG:-latest}
    build: { context: .., dockerfile: deploy/Dockerfile, target: api }
  worker:
    <<: *app
    image: ${IMAGE_PREFIX:-dastewasmiu/scrapbook}-worker:${IMAGE_TAG:-latest}
    build: { context: .., dockerfile: deploy/Dockerfile, target: worker }
    cpus: 1.0
    mem_limit: 1g
  nginx:
    image: ${IMAGE_PREFIX:-dastewasmiu/scrapbook}-nginx:${IMAGE_TAG:-latest}
    build: { context: .., dockerfile: deploy/Dockerfile, target: nginx }
    restart: unless-stopped
    depends_on: [api]
    # Default: behind your own HTTPS nginx on the host (see README). Plain HTTP, reachable from this host only.
    # For HTTPS directly on 80/443 instead: add -f compose.standalone.yml.
    environment:
      LOOKBACK_MODE: behind-proxy
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - media:/data/media:ro

volumes:
  pgdata:
  media:
  uploads:
