upstream api { server api:3000; }

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  root /usr/share/nginx/html;

  # Shared proxy headers. X-Forwarded-For is OVERWRITTEN (not appended) so clients can't spoof
  # the IP used for the login rate limit; the api runs with TRUST_PROXY=true.
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  # SPA: index.html never cached, hashed assets immutable.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
  }
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location /api/ {
    client_max_body_size 1m;
    proxy_pass http://api;
  }

  # tus: 50 MiB chunks streamed straight to the api (Location stays relative: tus relativeLocation=true).
  location /api/uploads {
    client_max_body_size 60m;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://api;
  }

  # Media straight from disk, gated by the api session cookie.
  location /media/ {
    auth_request /_auth;
    alias /data/media/;
    # nginx's stock mime.types already maps these; restated so HLS never depends on the base image.
    include /etc/nginx/mime.types;
    types {
      application/vnd.apple.mpegurl m3u8;
      video/mp2t ts;
    }
    add_header Cache-Control "private, max-age=31536000, immutable" always;
  }
  location = /_auth {
    internal;
    proxy_pass http://api/api/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
  }
}
